<!-- TRACKER -->
<section id="p-tracker" hidden>
  <div class="wrap">
    <div class="pagehead">
      <div class="eyebrow">The tracker</div>
      <h1 class="h-big" style="margin-top:12px">Every action, searchable.</h1>
      <p class="lede">Sorted newest first. Tap any entry for its full history and sources.</p>
    </div>
    <div class="filters">
      <input class="field search" id="q" type="search" placeholder="Search name, area or licence no." aria-label="Search">
      <select class="field" id="city" aria-label="City"><option value="">All cities</option></select>
      <select class="field" id="sort" aria-label="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option></select>
    </div>
    <div class="seg" id="seg"></div>
    <div class="count" id="count"></div>
    <div class="rows" id="rows"></div>
    <p class="fine">Compiled from public sources. Not an official FDA record. Status is as of each entry's "last verified" date. Not listed means no reported action, not a guarantee of hygiene.</p>
  </div>
</section>
