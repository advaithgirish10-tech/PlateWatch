<!-- SIMULATED WHATSAPP CHAT (reporting) -->
<div class="bot" id="bot" hidden>
  <div class="bot-scrim" data-bot-close></div>
  <section class="bot-panel" role="dialog" aria-modal="true" aria-labelledby="botTitle" aria-describedby="botDemo">
    <header class="bot-head">
      <span class="bot-av" aria-hidden="true">PW</span>
      <div class="bot-id">
        <div class="bot-title" id="botTitle">PlateWatch reports</div>
        <div class="bot-sub"><span class="bot-wa">WhatsApp</span><span id="botDemo">Demo — nothing is actually sent.</span></div>
      </div>
      <button class="bot-x" type="button" data-bot-close aria-label="Close chat"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </header>
    <div class="bot-log" id="botLog" role="log" aria-live="polite" aria-label="Chat messages" tabindex="-1"></div>
    <div class="bot-quick" id="botQuick" role="group" aria-label="Quick replies" hidden></div>
    <form class="bot-compose" id="botForm" autocomplete="off">
      <button class="bot-attach" type="button" id="botAttach" aria-label="Attach a photo, video or bill" disabled><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M13.5 6.5 7.8 12.2a1.8 1.8 0 0 0 2.5 2.5l6-6a3.5 3.5 0 0 0-5-5l-6.2 6.2a5.2 5.2 0 0 0 7.4 7.4l4.3-4.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <input type="file" id="botFile" hidden>
      <input class="bot-input" id="botInput" maxlength="500" placeholder="Type a message" aria-label="Message">
      <button class="bot-send" type="submit" aria-label="Send"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M4 10h11M11 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
  </section>
</div>
