<!-- KITCHEN GALLERY LIGHTBOX -->
<div class="glb" id="glb" hidden role="dialog" aria-modal="true" aria-label="Kitchen photo">
  <div class="glb-scrim" data-glb-close></div>
  <figure class="glb-fig">
    <div class="glb-img"><img id="glbImg" alt=""><span class="gal-blur" id="glbBlur" aria-hidden="true" hidden></span></div>
    <figcaption class="glb-cap" id="glbCap"></figcaption>
  </figure>
  <button class="glb-nav glb-prev" type="button" id="glbPrev" aria-label="Previous photo"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="glb-nav glb-next" type="button" id="glbNext" aria-label="Next photo"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="m7.5 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="glb-x" type="button" id="glbClose" data-glb-close aria-label="Close photo"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  <span class="glb-count" id="glbCount" aria-live="polite"></span>
</div>
