name: PlateWatch Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# a newer push to the same branch or PR cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vite build exits non-zero on any error, which fails the workflow
      - name: Build for production
        run: npm run build
